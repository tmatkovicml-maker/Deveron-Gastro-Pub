<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"/><meta name="robots" content="noindex"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QR kodovi za stolove</title>
<style>
@page{size:A4;margin:10mm;}
body{margin:0;font-family:Georgia,serif;background:#eee;}
.hint{max-width:190mm;margin:10px auto;font-family:sans-serif;font-size:14px;line-height:1.5;}
.sheet{width:190mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6mm;}
.card{background:#0a1628;color:#f5f0e8;border-radius:4mm;padding:5mm;text-align:center;height:131mm;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #999;break-inside:avoid;}
.logo{width:24mm;filter:invert(1) sepia(1) saturate(2) hue-rotate(5deg) brightness(1.1);}
.tbl{color:#c9a84c;font-size:9mm;letter-spacing:.08em;margin-top:2mm;}
.qr{background:#fff;padding:3mm;border-radius:2mm;margin:3mm 0;}
.qr svg,.qr img{width:50mm;height:50mm;display:block;}
.t1{color:#c9a84c;font-size:5.5mm;letter-spacing:.05em;}
.t2{color:#c0bbb3;font-size:3.2mm;margin-top:1.5mm;font-style:italic;}
.t3{color:#e8c97a;font-size:3.4mm;margin-top:2.5mm;letter-spacing:.1em;}
@media print{.hint{display:none;} body{background:#fff;} .card{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
</style>
<script src="qrcode.js"></script>
</head><body>
<p class="hint"><b>QR kartice za stolove</b> — ispis: Ctrl+P (4 kartice po listu A4), izrežite po isprekidanoj crti.<br>
Nazivi stolova dolaze iz administracije (Tlocrt). Broj u QR kodu se ne mijenja kad stol preimenujete ili pomaknete, pa se kartice tiskaju samo za nove stolove.<br>
<span id="count">Učitavanje stolova…</span></p>
<div class="sheet" id="sheet"></div>
<script>
// Same Worker as ORDER_API in index.html
const ORDER_API='https://deveron-gastro-pub.t-matkovicml.workers.dev';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function qrSvg(text){
  const q=qrcode(0,'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:1,margin:0,scalable:true});
}
fetch(ORDER_API+'/api/tables').then(r=>r.json()).then(d=>{
  const area={terasa:'Terasa',restoran:'Restoran'};
  const list=d.tables.slice().sort((a,b)=>a.area.localeCompare(b.area)*-1||a.id-b.id);
  document.getElementById('count').textContent=list.length+' stolova ('+Object.keys(area).map(a=>area[a]+': '+list.filter(t=>t.area===a).length).join(', ')+') · '+Math.ceil(list.length/4)+' listova A4';
  document.getElementById('sheet').innerHTML=list.map(t=>`<div class="card"><img class="logo" src="logo.png" alt=""/><div class="tbl">${esc(t.name)}</div><div class="qr">${qrSvg('https://deveronpub.com/?stol='+t.id)}</div>
<div class="t1">Meni i narudžba</div><div class="t2">Menu &amp; order · Speisekarte &amp; Bestellung · Menu e ordine</div><div class="t3">deveronpub.com</div></div>`).join('');
}).catch(()=>{document.getElementById('count').textContent='Stolovi se ne mogu učitati. Provjerite internet i osvježite stranicu.';});
</script>
</body></html>
