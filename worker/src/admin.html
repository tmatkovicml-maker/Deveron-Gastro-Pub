<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Deveron · Gosti i loyalty</title>
<style>
:root{--navy:#0a1628;--gold:#c9a84c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:#eef0f3;color:#111;}
header{background:var(--navy);color:var(--gold);padding:.9rem 1.2rem;}
header h1{font-size:1.15rem;letter-spacing:.1em;}
main{padding:1rem;max-width:1200px;margin:0 auto;}
.box{background:#fff;border-radius:10px;padding:1rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.stats{display:flex;gap:1rem;flex-wrap:wrap;}
.stat{flex:1;min-width:140px;}
.stat b{display:block;font-size:1.6rem;}
.stat span{color:#666;font-size:.85rem;}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
.tools input[type=search]{flex:1;min-width:180px;padding:.55rem .7rem;border:1px solid #ccc;border-radius:8px;font-size:1rem;}
.tools label{font-size:.95rem;}
button{padding:.55rem 1rem;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:.95rem;cursor:pointer;}
button.del{background:#fdecea;color:#b71c1c;padding:.35rem .6rem;}
table{width:100%;border-collapse:collapse;font-size:.92rem;}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid #eee;vertical-align:top;}
th{background:#f7f7f9;position:sticky;top:0;}
td.num{text-align:right;white-space:nowrap;}
.yes{color:#1b7f3b;font-weight:bold;}
.no{color:#aaa;}
.wrap{overflow-x:auto;}
.hint{color:#555;font-size:.9rem;line-height:1.5;}
code{background:#f1f1f1;padding:.05rem .3rem;border-radius:4px;}
.overlay{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;}
.overlay[hidden]{display:none;}
.overlay h2{color:var(--gold);letter-spacing:.1em;}
.overlay input{font-size:2rem;width:11rem;text-align:center;padding:.4rem;border-radius:8px;border:none;letter-spacing:.3em;}
.overlay button{font-size:1.2rem;padding:.8rem 2rem;background:var(--gold);color:var(--navy);font-weight:bold;}
#err{color:#ff8a80;min-height:1.2em;}
</style>
</head>
<body>
<header><h1>⚓ DEVERON · GOSTI I LOYALTY</h1></header>
<main>
  <div class="box stats" id="stats"></div>
  <div class="box">
    <div class="tools">
      <input type="search" id="q" placeholder="Traži ime, mobitel ili e-mail…" oninput="draw()"/>
      <label><input type="checkbox" id="mk" onchange="draw()"/> samo s privolom za poruke</label>
      <button onclick="csv()">⬇ Izvoz (CSV / Excel)</button>
    </div>
  </div>
  <div class="box wrap"><table>
    <thead><tr><th>Ime</th><th>Mobitel</th><th>E-mail</th><th>Loyalty</th><th>Poruke</th><th class="num">Potrošnja</th><th class="num">Narudžbe</th><th class="num">Popust</th><th>Zadnja narudžba</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="box hint" id="tiers"></div>
</main>

<div class="overlay" id="login">
  <h2>GOSTI I LOYALTY</h2>
  <p>Upišite PIN vlasnika (ADMIN_PIN).</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off"/>
  <div id="err"></div>
  <button onclick="login()">Prijava</button>
</div>

<script>
var PIN = sessionStorage.getItem('deveron-admin') || '', DATA = [];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function eur(x){ return (x || 0).toFixed(2).replace('.', ',') + ' €'; }
function day(ms){ return ms ? new Date(ms).toLocaleDateString('hr-HR') : '–'; }

function api(path, opts){
  opts = opts || {}; opts.headers = {'X-Admin-Pin': PIN};
  return fetch(path, opts).then(function(r){
    if (r.status === 401) return r.json().then(function(d){ throw d.error; });
    if (!r.ok) throw 'net';
    return r.json();
  });
}

function login(){
  PIN = document.getElementById('pin').value.trim();
  load().catch(function(e){
    document.getElementById('err').textContent = e === 'pin' ? 'Pogrešan PIN' :
      e === 'no_pin' ? 'ADMIN_PIN nije postavljen u Cloudflareu (Settings → Runtime variables and secrets)' : 'Nema veze s poslužiteljem';
  });
}

function load(){
  return api('/api/admin/customers').then(function(d){
    sessionStorage.setItem('deveron-admin', PIN);
    document.getElementById('login').hidden = true;
    DATA = d.customers;
    document.getElementById('tiers').innerHTML = '<b>Razine popusta:</b> ' +
      d.tiers.map(function(t){ return 'od ' + t[0] + ' € potrošnje → ' + t[1] + ' %'; }).join(' · ') +
      '<br>Promjena: Cloudflare → deveron-gastro-pub → Settings → Runtime variables → <code>LOYALTY_TIERS</code>, npr. <code>100:10,300:15</code>.' +
      '<br>Potrošnja se broji kad konobar na tabletu označi narudžbu za van kao „Preuzeto i plaćeno“. Gosti koji 2 godine ne naruče brišu se automatski.';
    draw();
  });
}

function list(){
  var q = document.getElementById('q').value.toLowerCase(), mk = document.getElementById('mk').checked;
  return DATA.filter(function(c){
    return (!mk || c.marketing) && (!q || [c.name, c.phone, c.email].join(' ').toLowerCase().indexOf(q) >= 0);
  });
}

function draw(){
  var l = list();
  var total = DATA.reduce(function(a, c){ return a + c.spent; }, 0);
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>' + DATA.length + '</b><span>gostiju ukupno</span></div>' +
    '<div class="stat"><b>' + DATA.filter(function(c){ return c.loyalty; }).length + '</b><span>u loyalty programu</span></div>' +
    '<div class="stat"><b>' + DATA.filter(function(c){ return c.marketing; }).length + '</b><span>s privolom za poruke</span></div>' +
    '<div class="stat"><b>' + eur(total) + '</b><span>ukupna potrošnja (za van)</span></div>';
  document.getElementById('rows').innerHTML = l.length ? l.map(function(c){
    return '<tr><td>' + esc(c.name) + '</td><td><a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a></td><td>' + esc(c.email) + '</td>' +
      '<td class="' + (c.loyalty ? 'yes">✓' : 'no">–') + '</td><td class="' + (c.marketing ? 'yes">✓' : 'no">–') + '</td>' +
      '<td class="num">' + eur(c.spent) + '</td><td class="num">' + c.orders + '</td><td class="num">' + (c.discount ? c.discount + ' %' : '–') + '</td>' +
      '<td>' + day(c.last_order) + '</td><td><button class="del" onclick="del(\'' + encodeURIComponent(c.phone) + '\')">Obriši</button></td></tr>';
  }).join('') : '<tr><td colspan="10" style="text-align:center;color:#888;padding:2rem">Nema gostiju</td></tr>';
}

function del(phone){
  if (!confirm('Trajno obrisati gosta ' + decodeURIComponent(phone) + ' i njegovu potrošnju? (zahtjev za brisanje, GDPR)')) return;
  api('/api/admin/customers/' + phone, {method: 'DELETE'}).then(load);
}

function csv(){
  var head = ['Ime', 'Mobitel', 'E-mail', 'Loyalty', 'Privola za poruke', 'Datum privole', 'Potrošnja (EUR)', 'Narudžbe', 'Popust (%)', 'Zadnja narudžba'];
  var rows = list().map(function(c){
    return [c.name, c.phone, c.email, c.loyalty ? 'DA' : 'NE', c.marketing ? 'DA' : 'NE', day(c.consent_at),
      c.spent.toFixed(2).replace('.', ','), c.orders, c.discount, day(c.last_order)];
  });
  var text = [head].concat(rows).map(function(r){
    return r.map(function(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(';');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + text], {type: 'text/csv;charset=utf-8'}));
  a.download = 'deveron-gosti-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}

document.getElementById('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
if (PIN) load().catch(function(){ sessionStorage.removeItem('deveron-admin'); PIN = ''; });
</script>
</body>
</html>
